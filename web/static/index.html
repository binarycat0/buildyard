<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buildyard</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
  <script defer src="/vendor/alpine-3.14.9.min.js"></script>
</head>
<body x-data="projectsPage" x-init="load()">
  <header class="top">
    <strong>Buildyard</strong>
    <span class="muted" x-text="health ? 'v' + health.version : ''"></span>
  </header>

  <main>
    <section class="toolbar">
      <h1>Проекты</h1>
      <button class="primary" @click="openAdd()" x-show="!adding">Добавить проект</button>
    </section>

    <form class="card add" x-show="adding" x-cloak @submit.prevent="add()">
      <label>Путь к корню проекта
        <input x-model="form.rootPath" x-ref="rootPath" placeholder="/Users/me/src/my-project" required>
      </label>
      <label>Имя <span class="muted">(необязательно, по умолчанию имя папки)</span>
        <input x-model="form.name">
      </label>
      <p class="error" x-show="formError" x-text="formError"></p>
      <div class="row">
        <button class="primary" type="submit" :disabled="busy">Добавить</button>
        <button type="button" @click="adding = false">Отмена</button>
      </div>
    </form>

    <p class="error" x-show="error" x-text="error"></p>
    <p class="muted" x-show="loaded && projects.length === 0 && !adding">
      Проектов пока нет. Добавьте папку с pom.xml.
    </p>

    <div class="grid">
      <template x-for="p in projects" :key="p.id">
        <article class="card">
          <div class="row spread">
            <template x-if="editing !== p.id">
              <h2 x-text="p.name"></h2>
            </template>
            <template x-if="editing === p.id">
              <input class="rename" x-model="editName" @keydown.enter="rename(p)" @keydown.escape="editing = null">
            </template>
            <span class="badge" x-text="p.buildTool"></span>
          </div>
          <code class="path" x-text="p.rootPath"></code>
          <p class="muted" x-text="lastJobText(p)"></p>
          <div class="row">
            <button x-show="editing !== p.id" @click="editing = p.id; editName = p.name">Переименовать</button>
            <button x-show="editing === p.id" class="primary" @click="rename(p)">Сохранить</button>
            <button class="danger" @click="remove(p)">Удалить</button>
          </div>
        </article>
      </template>
    </div>
  </main>
</body>
</html>
